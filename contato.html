<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Igreja Reformada da Graça | Contato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="index.html" class="brand">Igreja Reformada da Graça</a>
      <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <nav class="main-nav" id="main-nav">
        <a href="index.html">Início</a>
        <a href="quem-somos.html">Quem Somos</a>
        <a href="sermoes.html">Sermões</a>
        <a href="ministerios.html">Ministérios</a>
        <a href="contato.html" class="active">Contato</a>
      </nav>
    </header>

    <main class="page-main">
      <section class="section reveal">
        <div class="container contact-layout">
          <div>
            <h1>Entre em contato</h1>
            <form id="contact-form" novalidate>
              <label for="name">Nome</label>
              <input type="text" id="name" name="name" required />

              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" required />

              <label for="message">Mensagem</label>
              <textarea id="message" name="message" rows="5" required></textarea>

              <button type="submit" class="btn btn-primary">Enviar mensagem</button>
              <p id="form-status" class="form-status" role="status"></p>
            </form>

            <a class="btn btn-outline" href="https://wa.me/5500000000000" target="_blank" rel="noopener">Falar direto no WhatsApp</a>
          </div>

          <div class="map-box">
            <iframe
              src="https://www.google.com/maps?q=Pra%C3%A7a%20da%20S%C3%A9%2C%20S%C3%A3o%20Paulo&output=embed"
              style="border: 0"
              allowfullscreen
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              title="Mapa da igreja"
            ></iframe>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="copyright">© 2026 Igreja Reformada da Graça. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
